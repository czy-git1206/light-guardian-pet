name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Windows release archive
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "LightGuardianPet-v1.0.0"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $items = @(
            "assets",
            "codex-pet",
            "docs",
            "LightGuardianPet.ps1",
            "launch.cmd",
            "启动光之守护者.cmd",
            "README.md",
            "README.zh-CN.md",
            "LICENSE",
            "ASSET-LICENSE.md"
          )
          foreach ($item in $items) {
            Copy-Item -LiteralPath $item -Destination $releaseDir -Recurse -Force
          }
          Compress-Archive -Path $releaseDir -DestinationPath "LightGuardianPet-v1.0.0.zip" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "v1.0.0" 2>$null) {
            gh release upload "v1.0.0" "LightGuardianPet-v1.0.0.zip" --clobber
          } else {
            gh release create "v1.0.0" "LightGuardianPet-v1.0.0.zip" --target "$env:GITHUB_SHA" --title "Light Guardian Pet v1.0.0 / 光之守护者 v1.0.0" --notes-file "RELEASE_NOTES.md"
          }
